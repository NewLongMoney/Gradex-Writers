# Render Blueprint for Gradex Writers
# This file configures automatic deployment on Render

services:
  - type: web
    name: gradex-writers
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
    # Note: Add firebase-config.json as a secret file in Render dashboard

