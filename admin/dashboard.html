<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Gradex Writers</title>
    <link rel="stylesheet" href="../css/style.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0A1F44 0%, #08182F 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
        }

        .dashboard-header {
            background: linear-gradient(135deg, #0A1F44 0%, #1a3357 100%);
            padding: 1rem 0;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
            position: sticky;
            top: 0;
            z-index: 1000;
            border-bottom: 2px solid #D4AF37;
        }

        .dashboard-header .container {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dashboard-title {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .dashboard-title h1 {
            font-size: 1.5rem;
            color: var(--gold);
        }

        .user-info {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .user-info span {
            color: var(--white);
        }

        .logout-btn {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--white);
            border: 1px solid var(--white);
            padding: 0.5rem 1rem;
            border-radius: 5px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .logout-btn:hover {
            background-color: var(--white);
            color: var(--deep-blue);
        }

        .dashboard-content {
            padding: 2rem 0;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .action-bar h2 {
            color: var(--white);
            font-size: 2rem;
        }

        .new-article-btn {
            background-color: var(--gold);
            color: var(--deep-blue);
            border: none;
            padding: 0.75rem 1.5rem;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .new-article-btn:hover {
            background-color: var(--gold-dark);
            transform: translateY(-2px);
        }

        .articles-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .article-card {
            background-color: var(--light-blue);
            border-radius: 10px;
            padding: 1.5rem;
            border: 1px solid rgba(212, 175, 55, 0.2);
            transition: all 0.3s;
        }

        .article-card:hover {
            border-color: var(--gold);
            transform: translateY(-3px);
        }

        .article-card h3 {
            color: var(--gold);
            margin-bottom: 0.5rem;
            font-size: 1.2rem;
        }

        .article-meta {
            display: flex;
            gap: 1rem;
            margin: 0.5rem 0;
            font-size: 0.9rem;
            color: var(--white);
            opacity: 0.7;
        }

        .article-status {
            display: inline-block;
            padding: 0.25rem 0.75rem;
            border-radius: 15px;
            font-size: 0.8rem;
            font-weight: 600;
            margin: 0.5rem 0;
        }

        .status-published {
            background-color: rgba(0, 255, 0, 0.2);
            color: #4ade80;
        }

        .status-draft {
            background-color: rgba(255, 165, 0, 0.2);
            color: #fbbf24;
        }

        .article-excerpt {
            color: var(--white);
            opacity: 0.8;
            margin: 1rem 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .article-actions {
            display: flex;
            gap: 0.5rem;
            margin-top: 1rem;
        }

        .btn-edit, .btn-delete {
            padding: 0.5rem 1rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-edit {
            background-color: var(--gold);
            color: var(--deep-blue);
            flex: 1;
        }

        .btn-edit:hover {
            background-color: var(--gold-dark);
        }

        .btn-delete {
            background-color: rgba(255, 0, 0, 0.3);
            color: #ff6b6b;
            flex: 1;
        }

        .btn-delete:hover {
            background-color: rgba(255, 0, 0, 0.5);
        }

        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 2000;
            overflow-y: auto;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .modal-content {
            background-color: var(--light-blue);
            border-radius: 10px;
            padding: 2rem;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 2px solid var(--gold);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .modal-header h2 {
            color: var(--gold);
            font-size: 1.8rem;
        }

        .close-btn {
            background: none;
            border: none;
            color: var(--white);
            font-size: 2rem;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .close-btn:hover {
            color: var(--gold);
        }

        .article-form {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .form-group label {
            display: block;
            color: var(--white);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border-radius: 5px;
            border: 1px solid rgba(212, 175, 55, 0.3);
            background-color: var(--deep-blue);
            color: var(--white);
            font-size: 1rem;
            font-family: inherit;
        }

        .form-group textarea {
            min-height: 200px;
            resize: vertical;
        }

        .form-group input:focus,
        .form-group select:focus,
        .form-group textarea:focus {
            outline: none;
            border-color: var(--gold);
        }

        .form-actions {
            display: flex;
            gap: 1rem;
            justify-content: flex-end;
        }

        .btn-save, .btn-cancel {
            padding: 0.75rem 2rem;
            border: none;
            border-radius: 5px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-save {
            background-color: var(--gold);
            color: var(--deep-blue);
        }

        .btn-save:hover {
            background-color: var(--gold-dark);
        }

        .btn-cancel {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--white);
        }

        .btn-cancel:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .no-articles {
            text-align: center;
            padding: 3rem;
            color: var(--white);
            opacity: 0.7;
        }

        .loading {
            text-align: center;
            padding: 3rem;
            color: var(--white);
        }

        .view-site-btn {
            background-color: rgba(255, 255, 255, 0.1);
            color: var(--white);
            border: 1px solid var(--white);
            padding: 0.5rem 1rem;
            border-radius: 5px;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }

        .view-site-btn:hover {
            background-color: var(--white);
            color: var(--deep-blue);
        }
    </style>
</head>
<body>
    <div class="dashboard-header">
        <div class="container">
            <div class="dashboard-title">
                <svg class="logo-icon" viewBox="0 0 24 32" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M12 2L6 8L12 14L18 8L12 2Z" fill="white" stroke="white" stroke-width="0.5"/>
                    <circle cx="12" cy="8" r="1.5" fill="#0A1F44"/>
                    <line x1="12" y1="14" x2="12" y2="26" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
                    <path d="M9 26L12 29L15 26" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
                </svg>
                <h1>Admin Dashboard</h1>
            </div>
            <div class="user-info">
                <a href="/blog.html" class="view-site-btn">View Blog</a>
                <span id="userName"></span>
                <button class="logout-btn" id="logoutBtn">Logout</button>
            </div>
        </div>
    </div>

    <div class="dashboard-content">
        <div class="container">
            <div class="action-bar">
                <h2>Articles</h2>
                <button class="new-article-btn" id="newArticleBtn">+ New Article</button>
            </div>

            <div id="articlesContainer" class="articles-grid">
                <div class="loading">Loading articles...</div>
            </div>
        </div>
    </div>

    <!-- Article Modal -->
    <div id="articleModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle">New Article</h2>
                <button class="close-btn" id="closeModalBtn">&times;</button>
            </div>
            <form id="articleForm" class="article-form">
                <input type="hidden" id="articleId">
                
                <div class="form-group">
                    <label for="articleTitle">Title *</label>
                    <input type="text" id="articleTitle" required>
                </div>

                <div class="form-group">
                    <label for="articleExcerpt">Excerpt</label>
                    <textarea id="articleExcerpt" rows="3" placeholder="Short description of the article"></textarea>
                </div>

                <div class="form-group">
                    <label for="articleContent">Content *</label>
                    <textarea id="articleContent" required></textarea>
                </div>

                <div class="form-group">
                    <label for="articleCategory">Category</label>
                    <select id="articleCategory">
                        <option value="General">General</option>
                        <option value="Academic Writing">Academic Writing</option>
                        <option value="Business Writing">Business Writing</option>
                        <option value="Technical Writing">Technical Writing</option>
                        <option value="Creative Writing">Creative Writing</option>
                        <option value="Tips & Guides">Tips & Guides</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="articleAuthor">Author</label>
                    <input type="text" id="articleAuthor" value="Gradex Writers">
                </div>

                <div class="form-group">
                    <label for="articleImage">Image URL</label>
                    <input type="text" id="articleImage" placeholder="https://example.com/image.jpg">
                </div>

                <div class="form-group">
                    <label for="articleStatus">Status</label>
                    <select id="articleStatus">
                        <option value="draft">Draft</option>
                        <option value="published">Published</option>
                    </select>
                </div>

                <div class="form-actions">
                    <button type="button" class="btn-cancel" id="cancelBtn">Cancel</button>
                    <button type="submit" class="btn-save">Save Article</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="../public/firebase-init.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
